<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="crimsonBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A30000" />
      <stop offset="65%" stop-color="#8C0000" />
      <stop offset="100%" stop-color="#4A0000" />
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D6" />
      <stop offset="50%" stop-color="#FFE8A4" />
      <stop offset="100%" stop-color="#E5B869" />
    </linearGradient>
  </defs>
  <!-- Royal Crimson Medallion Background -->
  <circle cx="64" cy="64" r="61" fill="url(#crimsonBg)" stroke="url(#goldFoil)" stroke-width="4" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#FFE8A4" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 3" />
  <!-- Double Happiness 囍 Emblem -->
  <text
    x="64"
    y="86"
    text-anchor="middle"
    fill="url(#goldFoil)"
